name: Dotlocal formula

on:
  push:
    branches: [main]
    paths: [Formula/dotlocal.rb, scripts/**, .github/workflows/dotlocal.yml]
  pull_request:
    paths: [Formula/dotlocal.rb, scripts/**, .github/workflows/dotlocal.yml]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotlocal-formula-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      test: ${{ steps.formula.outputs.test }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Authenticate stable channel and validate release archives
        id: formula
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/update-dotlocal.py
          if [ "${{ github.event_name }}" = schedule ] && git diff --quiet -- Formula/dotlocal.rb; then
            echo 'test=false' >> "$GITHUB_OUTPUT"
          else
            echo 'test=true' >> "$GITHUB_OUTPUT"
            python3 scripts/update-dotlocal.py --previous --output baseline.rb
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.formula.outputs.test == 'true'
        with:
          name: dotlocal-formulas
          path: |
            Formula/dotlocal.rb
            baseline.rb
          if-no-files-found: error

  install:
    needs: prepare
    if: needs.prepare.outputs.test == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_ANALYTICS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dotlocal-formulas
          path: candidate
      - name: Set up Homebrew
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v brew >/dev/null; then
            prefix=/home/linuxbrew/.linuxbrew
            if [ ! -x "$prefix/bin/brew" ]; then
              sudo mkdir -p "$prefix/Homebrew" "$prefix/bin"
              sudo chown -R "$(id -un):$(id -gn)" "$prefix"
              git -C "$prefix/Homebrew" init
              git -C "$prefix/Homebrew" remote add origin https://github.com/Homebrew/brew
              git -C "$prefix/Homebrew" fetch --depth=1 origin f2996fc035a38624ebbb6b919f49d30403eb78d2
              git -C "$prefix/Homebrew" checkout FETCH_HEAD
              ln -s ../Homebrew/bin/brew "$prefix/bin/brew"
            fi
            echo "$prefix/bin" >> "$GITHUB_PATH"
          fi
      - name: Install, upgrade, self-update, roll back and route strict HTTPS
        shell: bash
        run: bash scripts/test-brew.sh candidate/Formula/dotlocal.rb candidate/baseline.rb

  publish:
    needs: [prepare, install]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dotlocal-formulas
          path: tested
      - name: Commit the tested formula if changed
        shell: bash
        run: |
          set -euo pipefail
          current=$(sed -n 's|.*releases/download/v\([0-9.]*\)/.*|\1|p' Formula/dotlocal.rb | head -n 1)
          candidate=$(sed -n 's|.*releases/download/v\([0-9.]*\)/.*|\1|p' tested/Formula/dotlocal.rb | head -n 1)
          newest=$(printf '%s\n' "$current" "$candidate" | sort -V | tail -n 1)
          if [ "$newest" != "$candidate" ]; then
            echo 'Refusing to replace a newer formula'
            exit 1
          fi
          cp tested/Formula/dotlocal.rb Formula/dotlocal.rb
          if git diff --quiet -- Formula/dotlocal.rb; then exit 0; fi
          version=$(sed -n 's|.*releases/download/v\([0-9.]*\)/.*|\1|p' Formula/dotlocal.rb | head -n 1)
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Formula/dotlocal.rb
          git commit -m "Update dotlocal to $version"
          git push origin HEAD:main
